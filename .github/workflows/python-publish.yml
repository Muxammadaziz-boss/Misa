# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    outputs:
      has_pkg: ${{ steps.check_pkg.outputs.has_pkg }}

    steps:
      - uses: actions/checkout@v4

      - name: Check if PyPI package
        id: check_pkg
        run: |
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pkg=false" >> "$GITHUB_OUTPUT"
            echo "No pyproject.toml or setup.py found. Skipping PyPI publishing."
          fi

      - uses: actions/setup-python@v5
        if: steps.check_pkg.outputs.has_pkg == 'true'
        with:
          python-version: "3.x"

      - name: Build release distributions
        if: steps.check_pkg.outputs.has_pkg == 'true'
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        if: steps.check_pkg.outputs.has_pkg == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    if: needs.release-build.outputs.has_pkg == 'true'
    permissions:
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
