name: Python application

on:
  push:
    branches: [ "dev-v9.0.0", "dev-v8.0.0", "main" ]
  pull_request:
    branches: [ "dev-v9.0.0", "dev-v8.0.0", "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Python App Lint & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 aiohttp psutil requests python-dotenv Pillow numpy packaging cryptography
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,.venv,release,dist,Misa
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.git,__pycache__,.venv,release,dist,Misa
    - name: Test with unittest
      run: |
        python -m unittest tests/test_intelligence_core.py tests/test_security_api.py tests/test_account_api.py tests/test_plugins_api.py tests/test_scheduler_api.py tests/test_memory_api.py tests/test_commands_api.py
