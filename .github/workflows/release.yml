name: Misa AI Windows Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign & Release Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography aiohttp packaging psutil requests

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Misa/package.json'

      - name: Install Frontend Dependencies
        working-directory: Misa
        run: npm install

      - name: Run Backend Tests
        run: |
          python -m unittest tests/test_v8_secure_updater.py
          python -m unittest tests/test_v8_backend_bundle.py

      - name: Run Frontend Tests
        working-directory: Misa
        run: npm test

      - name: Build Frontend Application
        working-directory: Misa
        run: npm run build

      - name: Check / Build Tauri Desktop Application
        run: |
          $tag = "${{ github.ref_name }}"
          $exePath = "release/$tag/Misa-AI-$tag.exe"
          if (-not (Test-Path $exePath)) {
              $exePath = "release/$tag/Mikasa-AI-$tag.exe"
          }
          if (Test-Path $exePath) {
              Write-Host "Pre-compiled desktop binaries found at $exePath. Skipping recompilation."
          } else {
              Write-Host "No pre-compiled binaries found for $tag. Building Tauri desktop application..."
              cd Misa
              npm run build:desktop
              node scripts/package_release.cjs
              cd ..
          }

      - name: Cryptographically Sign Release Manifest (Ed25519)
        env:
          MIKASA_RELEASE_SIGNING_KEY: ${{ secrets.MIKASA_RELEASE_SIGNING_KEY }}
        run: |
          $tag = "${{ github.ref_name }}"
          $manifest = "release/$tag/version_manifest.json"
          if (-not (Test-Path $manifest)) {
              $manifest = "release/v8.0.0/version_manifest.json"
          }
          if ($env:MIKASA_RELEASE_SIGNING_KEY) {
              Write-Host "MIKASA_RELEASE_SIGNING_KEY secret found. Signing release manifest..."
              python packaging/sign_release.py --manifest $manifest
          } else {
              Write-Host "MIKASA_RELEASE_SIGNING_KEY not set in GitHub secrets. Verifying pre-signed manifest..."
              python -c "import json; from core.v8.update_service import UpdateCrypto; c = UpdateCrypto(); m = json.load(open('$manifest')); [c.verify_artifact('release/$tag/' + f['name'], f['sha256'], f['signature']) for f in m.get('files', []) if 'signature' in f]; print('Verified pre-signed release manifest successfully.')"
          }

      - name: Clean Existing Release Assets
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Checking if release $tag already exists on GitHub..."
          try {
              $releaseJson = gh release view $tag --json assets 2>$null
              if ($LASTEXITCODE -eq 0 -and $releaseJson) {
                  Write-Host "Release $tag exists. Cleaning up older assets to guarantee clean update..."
                  $assets = $releaseJson | ConvertFrom-Json | Select-Object -ExpandProperty assets -ErrorAction SilentlyContinue
                  foreach ($asset in $assets) {
                      if ($asset.name) {
                          Write-Host "Deleting existing asset: $($asset.name)"
                          gh release delete-asset $tag $asset.name --yes 2>$null
                      }
                  }
              } else {
                  Write-Host "Release $tag does not exist yet. Proceeding with fresh creation."
              }
          } catch {
              Write-Host "No prior release found or clean skipped: $_"
          }

      - name: Create GitHub Release & Upload Signed Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Misa AI ${{ github.ref_name }} (Windows Production Release)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚀 Misa AI ${{ github.ref_name }} — Level 9 Autonomous Desktop Assistant & Intelligence Hub

            Rasmiy Misa AI ${{ github.ref_name }} Windows Production Release.

            ### 📦 Reliz Fayllari (SHA-256 va Ed25519 bilan himoyalangan):
            - **`Misa-AI-${{ github.ref_name }}-Portable.zip`**: To'liq mustaqil (Self-contained) portativ arxiv (ichida standalone backend runtime, WebView2Loader va `run_portable.bat` bilan, foydalanuvchidan Python yoki Node.js talab qilinmaydi).
            - **`Misa-AI-Setup-${{ github.ref_name }}.exe`**: Windows NSIS Setup o'rnatuvchisi (Tavsiya etiladi).
            - **`Misa-AI-${{ github.ref_name }}.exe`**: O'zida WebView2Loader kutubxonasini avtomatik ta'minlovchi mustaqil ilova.
            - **`Misa-AI-${{ github.ref_name }}.msi`**: Standart Windows Installer paketi.
            - **`WebView2Loader.dll`**: Native Windows runtime dll.
            - **`run_portable.bat`**: Backend va Frontendni bir bosishda ishga tushiruvchi bat skript.
            - **`version_manifest.json`**: Kriptografik imzolangan va tekshirilgan reliz manifesti.

            ### ⚡ Yangi Imkoniyatlar (${{ github.ref_name }}):
            1. **Intellektual Ovozli Yordamchi**: Wake-word (`Hey Misa`), jonli mikrofon oqimi, dynamic hot-plug audio qurilmalar boshqaruvi va RVC (Retrieval-based Voice Conversion) vokal modellar integratsiyasi.
            2. **Self-Contained Backend**: Python 3.11 yoki Node.js o'rnatilmagan kompyuterlarda ham `127.0.0.1:18420` backend to'liq mustaqil ishlaydi.
            3. **Native Tauri Desktop Supervisor**: Dastur ochilganda backend holati tekshiriladi, fon rejimida boshqariladi va ilova yopilganda toza to'xtatiladi.
            4. **Google OAuth & Desktop Pairing**: Brauzer orqali Google OAuth autentifikatsiyasi va avtomatik callback sessiyalari 100% integratsiya qilindi.
            5. **Kriptografik Xavfsizlik**: Barcha reliz artefaktlari SHA-256 va Ed25519 algoritmi bilan ta'minlangan xavfsiz avtomatik yangilanish tizimi bilan himoyalangan.
          files: |
            release/${{ github.ref_name }}/*.exe
            release/${{ github.ref_name }}/*.msi
            release/${{ github.ref_name }}/*.zip
            release/${{ github.ref_name }}/version_manifest.json
            release/${{ github.ref_name }}/WebView2Loader.dll
            release/${{ github.ref_name }}/run_portable.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

